name: Hourly - Italy Today Sources

on:
  schedule:
    # Every hour, 7am-10pm CET (6am-9pm UTC)
    - cron: '0 6-21 * * *'
  workflow_dispatch: {}

concurrency:
  group: italy-today-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-sources:
    uses: ./.github/workflows/generate_briefing.yml
    with:
      show_name: 'italy-today'
      until: 'sources-view'
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
